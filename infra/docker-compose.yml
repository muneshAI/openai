version: '3.9'

services:
  api:
    image: python:3.12-slim
    working_dir: /app
    command: bash -lc "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ../apps/api:/app
    ports:
      - '8000:8000'
    environment:
      ENVIRONMENT: development

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ../apps/web:/app
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
