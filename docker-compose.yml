version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fitness
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - '8000:8000'

  celery-worker:
    build:
      context: ./backend
    command: celery -A app.celery_app.celery worker -l info
    env_file:
      - .env
    depends_on:
      - backend
      - redis

  celery-beat:
    build:
      context: ./backend
    command: celery -A app.celery_app.celery beat -l info
    env_file:
      - .env
    depends_on:
      - backend
      - redis

volumes:
  postgres_data:
